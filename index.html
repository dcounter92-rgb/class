
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANONYMOUS CYBER TERMINAL</title>

<style>
:root{
    --green:#00ff66;
    --red:#ff3030;
    --cyan:#00eaff;
    --yellow:#ffe600;
    --black:#020805;
    --panel:rgba(0,12,7,.96);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--black);
    color:var(--green);
    font-family:Consolas,"Courier New",monospace;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    opacity:.16;
    z-index:0;
}

.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
    background:repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(0,255,102,.025) 4px
    );
}

/* ================= GENERAL ================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.94);
}

.box{
    width:min(92vw,560px);
    border:1px solid var(--green);
    background:var(--panel);
    box-shadow:0 0 35px rgba(0,255,102,.20);
    padding:28px;
}

h1,
h2{
    margin:0 0 16px;
    text-shadow:0 0 12px var(--green);
}

.muted{
    opacity:.7;
}

.red{
    color:var(--red);
}

.cyan{
    color:var(--cyan);
}

.yellow{
    color:var(--yellow);
}

.btn{
    border:1px solid var(--green);
    background:#001b0d;
    color:var(--green);
    padding:10px 15px;
    margin:4px;
    transition:.15s;
}

.btn:hover{
    background:#00351a;
    box-shadow:0 0 15px rgba(0,255,102,.35);
}

/* ================= LOGIN ================= */

#login{
    display:flex;
}

#loginPass{
    width:100%;
    padding:14px;
    margin:12px 0;
    background:#000;
    border:1px solid var(--green);
    color:var(--green);
    outline:none;
    font-size:18px;
    text-align:center;
    letter-spacing:4px;
}

#loginPass:focus{
    box-shadow:0 0 15px rgba(0,255,102,.25);
}

#loginMsg{
    min-height:22px;
    margin-top:10px;
    font-weight:bold;
}

/* ================= OVERRIDE ================= */

#override{
    display:none;
    text-align:center;
}

.skull{
    font-size:clamp(110px,24vw,230px);
    line-height:1;
    text-shadow:0 0 40px var(--green);
    animation:skullPulse 1.2s infinite alternate;
}

@keyframes skullPulse{
    from{
        filter:brightness(.9);
    }
    to{
        filter:brightness(1.7);
        transform:scale(1.02);
    }
}

/* ================= APP ================= */

#app{
    display:none;
    position:relative;
    z-index:5;
    height:100%;
    padding:18px;
}

header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid var(--green);
    padding-bottom:10px;
}

.brand{
    font-weight:bold;
}

.status{
    color:var(--cyan);
}

.grid{
    height:calc(100% - 62px);
    display:grid;
    grid-template-columns:1fr 300px;
    gap:14px;
    padding-top:14px;
}

.panel{
    border:1px solid rgba(0,255,102,.5);
    background:rgba(0,8,4,.78);
    padding:14px;
    overflow:auto;
}

#terminal{
    height:calc(100% - 60px);
    overflow:auto;
    white-space:pre-wrap;
    line-height:1.5;
}

.line{
    margin-bottom:4px;
}

.prompt{
    color:var(--cyan);
}

.quick{
    margin-top:10px;
}

.network{
    display:flex;
    align-items:center;
    justify-content:center;
    height:180px;
    border:1px dashed rgba(0,234,255,.5);
    margin-bottom:14px;
}

.globe{
    font-size:75px;
    animation:spin 8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= MODALS ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:40;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.80);
    padding:18px;
}

.modal .box{
    max-height:90vh;
    overflow:auto;
}

.suspect{
    border:1px solid rgba(0,255,102,.45);
    padding:12px;
    margin:8px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.suspect:hover{
    background:rgba(0,255,102,.06);
}

.dossier{
    border-color:var(--red);
    box-shadow:0 0 30px rgba(255,48,48,.16);
}

.dossier h2{
    color:var(--red);
}

.tag{
    display:inline-block;
    border:1px solid var(--red);
    color:var(--red);
    padding:4px 8px;
    margin-bottom:8px;
}

/* ================= OVERVIEW POPUP ================= */

.overview-box{
    width:min(94vw,650px);
    max-height:92vh;
    overflow:auto;
    border:1px solid var(--cyan);
    background:#010806;
    box-shadow:0 0 35px rgba(0,234,255,.22);
    padding:22px;
}

.overview-title{
    color:var(--cyan);
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.analysis-img{
    display:block;
    width:min(100%,360px);
    height:360px;
    object-fit:cover;
    margin:18px auto;
    border:1px solid var(--cyan);
    background:#000;
}

.analysis-close{
    border:1px solid var(--cyan);
    background:#00151a;
    color:var(--cyan);
    padding:10px 15px;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .panel.side{
        display:none;
    }

    #app{
        padding:10px;
    }

    header{
        font-size:12px;
    }

    .box{
        padding:20px;
    }
}
</style>
</head>
