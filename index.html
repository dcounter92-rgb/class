
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANONYMOUS CYBER TERMINAL</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #00ff66;
    font-family: "Courier New", monospace;
}

body {
    position: relative;
}

#matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: .25;
}

.screen {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
}

/* ---------- LOGIN ---------- */

#loginScreen {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 20px;
}

.loginBox {
    width: min(480px, 94vw);
    padding: 35px;
    border: 1px solid #00ff66;
    background: rgba(0, 15, 5, .94);
    box-shadow: 0 0 35px rgba(0,255,100,.25);
    text-align: center;
}

.logo {
    font-size: clamp(25px, 5vw, 45px);
    font-weight: bold;
    text-shadow: 0 0 15px #00ff66;
    margin-bottom: 8px;
}

.sub {
    color: #54ff9a;
    font-size: 12px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 14px;
    background: #000;
    border: 1px solid #00ff66;
    color: #00ff66;
    font-family: inherit;
    font-size: 18px;
    outline: none;
    text-align: center;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.mainBtn {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    background: #00ff66;
    color: #000;
    border: 0;
    font-weight: bold;
    font-family: inherit;
    font-size: 16px;
}

.mainBtn:hover {
    box-shadow: 0 0 20px #00ff66;
}

#error {
    min-height: 20px;
    margin-top: 15px;
    color: #ff3333;
}

/* ---------- OVERRIDE ---------- */

#overrideScreen {
    display: none;
    height: 100%;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.skull {
    font-size: clamp(80px, 18vw, 190px);
    animation: pulse 1.2s infinite alternate;
}

.overrideText {
    font-size: clamp(30px, 7vw, 70px);
    font-weight: bold;
    text-shadow: 0 0 25px #00ff66;
}

@keyframes pulse {
    from { transform: scale(1); text-shadow: 0 0 10px #00ff66; }
    to { transform: scale(1.08); text-shadow: 0 0 40px #00ff66; }
}

/* ---------- TERMINAL ---------- */

#terminalScreen {
    display: none;
    height: 100%;
    padding: 15px;
}

.terminal {
    width: 100%;
    height: 100%;
    border: 1px solid #00ff66;
    background: rgba(0, 10, 3, .88);
    display: flex;
    flex-direction: column;
}

.topbar {
    padding: 12px;
    border-bottom: 1px solid #00ff66;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.status {
    color: #00ff66;
}

.terminalOutput {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.commandArea {
    border-top: 1px solid #00ff66;
    padding: 12px;
}

.commandInput {
    display: flex;
    align-items: center;
    gap: 8px;
}

.prompt {
    font-weight: bold;
}

#command {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 0;
    color: #00ff66;
    text-align: left;
    font-size: 16px;
}

.quickButtons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.quickButtons button {
    background: #001d0a;
    color: #00ff66;
    border: 1px solid #00ff66;
    padding: 8px 12px;
}

.quickButtons button:hover {
    background: #00ff66;
    color: #000;
}

/* ---------- MODALS ---------- */

.modal {
    display: none;
    position: fixed;
    z-index: 20;
    inset: 0;
    background: rgba(0,0,0,.78);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modalBox {
    width: min(900px, 96vw);
    max-height: 92vh;
    overflow-y: auto;
    border: 1px solid #00ff66;
    background: #000b04;
    box-shadow: 0 0 35px rgba(0,255,100,.3);
    padding: 20px;
    position: relative;
}

.modalTitle {
    border-bottom: 1px solid #00ff66;
    padding-bottom: 12px;
    margin-bottom: 18px;
    font-size: clamp(18px, 4vw, 28px);
}

.close {
    position: absolute;
    right: 15px;
    top: 10px;
    border: 0;
    background: transparent;
    color: #00ff66;
    font-size: 25px;
}
