
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANONYMOUS CYBER TERMINAL // DEAD COUNTER</title>

    <style>
        :root {
            --bg-color: #050508;
            --terminal-bg: rgba(10, 15, 24, 0.95);
            --primary-green: #00ff66;
            --accent-cyan: #00f3ff;
            --alert-red: #ff0055;
            --text-color: #a3f7bf;
            --border-color: #00ff6644;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(8px);
        }

        .bg-skull {
            position: absolute;
            font-size: 42vw;
            color: #ffffff;
            opacity: 0.12;
            filter: drop-shadow(0 0 30px #ffffff);
            pointer-events: none;
            z-index: 1;
            animation: skullPulse 4s infinite alternate ease-in-out;
        }

        @keyframes skullPulse {
            0% {
                opacity: 0.08;
                transform: scale(0.98);
            }

            100% {
                opacity: 0.16;
                transform: scale(1.02);
            }
        }

        .login-card {
            background: rgba(8, 14, 12, 0.92);
            border: 2px solid var(--primary-green);
            box-shadow: 0 0 30px var(--primary-green);
            padding: 40px 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
        }

        .welcome-title {
            color: var(--primary-green);
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--primary-green);
        }

        .welcome-sub {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .login-btn {
            background: transparent;
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: var(--font-mono);
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: var(--primary-green);
            color: #000;
            box-shadow: 0 0 20px var(--primary-green);
        }

        .pass-input-group {
            display: none;
            margin-top: 20px;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .pass-input {
            background: #000;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px;
            font-family: var(--font-mono);
            font-size: 1.2rem;
            text-align: center;
            width: 200px;
            letter-spacing: 5px;
            border-radius: 4px;
            outline: none;
        }

        .status-msg {
            font-size: 1rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .accepted {
            color: var(--primary-green);
        }

        .denied {
            color: var(--alert-red);
        }

        #giantSkullScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .flash-skull {
            font-size: 65vh;
            color: #ffffff;
            text-shadow: 0 0 50px #00ff66;
            animation: skullFlicker 0.15s infinite alternate;
        }

        @keyframes skullFlicker {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        .terminal-container {
            width: 90vw;
            height: 85vh;
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
            z-index: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-title {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terminal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
        }

        .output-line {
            line-height: 1.4;
            word-break: break-all;
            user-select: text;
        }

        .system-text {
            color: #888;
        }

        .accent-text {
            color: var(--accent-cyan);
        }

        .success-text {
            color: var(--primary-green);
        }

        .alert-text {
            color: var(--alert-red);
        }

        .files-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .file-card {
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-card:hover {
            background: rgba(0, 255, 102, 0.2);
            border-color: var(--primary-green);
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .file-name {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            text-align: center;
            font-weight: bold;
        }

        .input-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .prompt {
            color: var(--primary-green);
            font-weight: bold;
            white-space: nowrap;
        }

        .term-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 1rem;
            width: 100%;
        }

        .quick-actions {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
            padding: 5px 12px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .action-btn:hover {
            background: var(--primary-green);
            color: #000;
        }

        .globe-panel {
            position: fixed;
            top: 0;
            right: -340px;
            width: 320px;
            height: 100vh;
            background: rgba(5, 10, 18, 0.95);
            backdrop-filter: blur(10px);
            border-left: 2px solid var(--primary-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 150;
        }

        .globe-panel.active {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--alert-red);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .globe-container {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 10px -10px 25px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 255, 102, 0.5);
            background: #0284c7;
            margin-bottom: 24px;
        }

        .globe-map {
            width: 200%;
            height: 100%;
            position: absolute;
            background: repeating-linear-gradient(
                90deg,
                #15803d 0px,
                #15803d 40px,
                #0284c7 40px,
                #0284c7 90px,
                #166534 90px,
                #166534 140px,
                #0284c7 140px,
                #0284c7 180px
            );
            animation: spin 6s linear infinite;
            opacity: 0.85;
        }

        @keyframes spin {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .globe-status {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-green);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-green);
            text-align: center;
        }

        .status-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(5, 10, 18, 0.95);
            border: 2px solid var(--accent-cyan);
            padding: 30px 50px;
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 250;
        }

        .status-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .status-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 3px;
        }

        .status-text.connected {
            color: var(--primary-green);
            text-shadow: 0 0 10px var(--primary-green);
        }

        .classified-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .classified-box {
            background: #080e14;
            border: 2px solid var(--alert-red);
            box-shadow: 0 0 25px var(--alert-red);
            padding: 25px 35px;
            border-radius:
