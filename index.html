
<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>

<body style="background:black;color:#00ff66;font-family:monospace;text-align:center;padding-top:100px;">

    <h1>LOGIN TEST</h1>

    <input
        id="password"
        type="password"
        placeholder="Enter password"
    >

    <button id="login">
        LOGIN
    </button>

    <h2 id="result"></h2>

<script>

document.getElementById("login").onclick = function(){

    const password =
        document.getElementById("password").value;

    if(password === "1234"){

        document.getElementById("result").textContent =
            "✅ LOGIN SUCCESS";

    }else{

        document.getElementById("result").textContent =
            "❌ WRONG PASSWORD";

    }

};

</script>

</body>
</html>
